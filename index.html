<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vee Video Maker - Simple Studio with Sound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { margin-bottom: 20px; text-align: center; }
        h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.9rem; }
        
        .studio-container { display: flex; flex-direction: column; width: 100%; max-width: 600px; gap: 20px; }
        
        .preview-box {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            max-height: 500px;
            background: #020617;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .caption-text {
            position: relative;
            z-index: 2;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            line-height: 1.3;
            word-break: break-word;
            transition: transform 0.15s ease;
        }

        .controls-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #334155;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }
        textarea { resize: vertical; min-height: 100px; }

        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-secondary { background: #475569; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>Vee Video Maker</h1>
        <p>Animated captions with built-in ambient audio synthesizer!</p>
    </header>

    <div class="studio-container">
        <!-- Video Preview Canvas / Box -->
        <div class="preview-box" id="previewBox">
            <canvas id="bgCanvas"></canvas>
            <div class="caption-text" id="captionDisplay">Your text will appear here...</div>
        </div>

        <!-- Controls -->
        <div class="controls-panel">
            <div class="input-group">
                <label>Your Script</label>
                <textarea id="scriptInput">Want to start a business with ZERO capital? Stop waiting and do this today. Monetize what you already know. Leverage free AI tools to speed up workflow. Pitch 10 small businesses every day. Build your offer today!</textarea>
            </div>

            <div class="input-group">
                <label>Background Theme</label>
                <select id="bgTheme">
                    <option value="particles">Neon Floating Particles</option>
                    <option value="matrix">Cyber Matrix Grid</option>
                    <option value="gradient">Deep Gradient Glow</option>
                </select>
            </div>

            <div class="btn-row">
                <button class="btn-primary" id="playBtn">▶ Play with Audio</button>
                <button class="btn-secondary" id="resetBtn">↺ Reset</button>
            </div>
        </div>
    </div>

    <script>
        const scriptInput = document.getElementById('scriptInput');
        const captionDisplay = document.getElementById('captionDisplay');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const bgTheme = document.getElementById('bgTheme');
        
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let animationId;
        let isPlaying = false;
        let currentIndex = 0;
        let timer = null;

        // Web Audio API Synth variables
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        function startAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Create ambient chord synth loop
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'sine'; // Smooth tone
            oscillator.frequency.setValueAtTime(220, audioCtx.currentTime); // A3 note base

            // Low volume ambient fade
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopAudio() {
            if (oscillator) {
                try {
                    oscillator.stop();
                    oscillator.disconnect();
                } catch(e) {}
                oscillator = null;
            }
        }

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Background Particle Engine
        let particles = [];
        for(let i=0; i<40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1,
                speedY: (Math.random() - 0.5) * 1.5,
                speedX: (Math.random() - 0.5) * 1.5
            });
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const theme = bgTheme.value;
            
            if (theme === 'gradient') {
                let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(1, '#311042');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = theme === 'matrix' ? '#22c55e' : '#38bdf8';
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();

                    p.y += p.speedY;
                    p.x += p.speedX;

                    if(p.y < 0) p.y = canvas.height;
                    if(p.y > canvas.height) p.y = 0;
                    if(p.x < 0) p.x = canvas.width;
                    if(p.x > canvas.width) p.x = 0;
                });
            }

            animationId = requestAnimationFrame(drawBackground);
        }
        drawBackground();

        // Play Script Animation & Sound
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
                return;
            }

            let text = scriptInput.value.trim();
            if (!text) {
                alert('Please enter a script first!');
                return;
            }

            let sentences = text.split(/(?<=[.?!])\s+/);
            if (sentences.length === 0) return;

            isPlaying = true;
            playBtn.textContent = '⏹ Stop Preview';
            playBtn.style.background = '#ef4444';
            playBtn.style.color = '#fff';
            currentIndex = 0;

            // Start sound synthesizer
            startAudio();

            function showNextSentence() {
                if (!isPlaying) return;
                
                if (currentIndex < sentences.length) {
                    captionDisplay.textContent = sentences[currentIndex];
                    // Pop effect
                    captionDisplay.style.transform = 'scale(1.06)';
                    setTimeout(() => captionDisplay.style.transform = 'scale(1)', 150);
                    
                    currentIndex++;
                    timer = setTimeout(showNextSentence, 3200); // 3.2 seconds per sentence
                } else {
                    stopPlayback();
                }
            }

            showNextSentence();
        });

        function stopPlayback() {
            isPlaying = false;
            clearTimeout(timer);
            stopAudio();
            playBtn.textContent = '▶ Play with Audio';
            playBtn.style.background = '#38bdf8';
            playBtn.style.color = '#0f172a';
            captionDisplay.textContent = 'Preview finished.';
        }

        resetBtn.addEventListener('click', () => {
            stopPlayback();
            captionDisplay.textContent = 'Your text will appear here...';
        });
    </script>
</body>
</html>
